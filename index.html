<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyatt Admin Portal</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
:root {
    --bg: #0f172a;
    --bg-soft: #111827;
    --card: rgba(255,255,255,0.04);
    --border: rgba(255,255,255,0.08);
    --text: #f8fafc;
    --muted: #94a3b8;
    --gold: #c5a880;
    --green: #22c55e;
    --red: #ef4444;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Plus Jakarta Sans',sans-serif;
    background:linear-gradient(135deg,#0b1220,#111827);
    color:var(--text);
    min-height:100vh;
}

.admin-container{
    display:flex;
    min-height:100vh;
}

/* Sidebar */
.sidebar{
    width:250px;
    background:rgba(0,0,0,0.25);
    border-right:1px solid var(--border);
    padding:24px 18px;
    display:flex;
    flex-direction:column;
    gap:20px;
}

.sidebar h2{
    font-family:'Playfair Display',serif;
    font-size:1.8rem;
    color:var(--gold);
}

.sidebar p{
    color:var(--muted);
    font-size:0.9rem;
    margin-bottom:10px;
}

.sidebar nav{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.menu-btn{
    background:transparent;
    border:1px solid var(--border);
    color:var(--text);
    padding:12px 14px;
    border-radius:12px;
    text-align:left;
    cursor:pointer;
    transition:all .2s ease;
    font-weight:600;
}

.menu-btn:hover,
.menu-btn.active{
    background:rgba(197,168,128,0.15);
    border-color:var(--gold);
    color:var(--gold);
}

.menu-btn.logout:hover{
    background:rgba(239,68,68,0.15);
    border-color:var(--red);
    color:#fecaca;
}

/* Content */
.content{
    flex:1;
    padding:28px;
}

.top-header{
    margin-bottom:24px;
}

.top-header h1{
    font-size:2rem;
    margin-bottom:6px;
}

.top-header p{
    color:var(--muted);
}

/* Stats */
.stats-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:16px;
    margin-bottom:24px;
}

.stat-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    padding:20px;
    backdrop-filter:blur(12px);
}

.stat-card h3{
    color:var(--muted);
    font-size:0.9rem;
    margin-bottom:8px;
}

.stat-card h2{
    font-size:2rem;
    color:var(--gold);
}

/* Search */
.search-box{
    margin-bottom:24px;
}

.search-box input{
    width:100%;
    padding:14px 16px;
    border-radius:14px;
    border:1px solid var(--border);
    background:rgba(255,255,255,0.03);
    color:var(--text);
    font-size:0.95rem;
    outline:none;
}

.search-box input:focus{
    border-color:var(--gold);
}

/* Cards */
.card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:22px;
    padding:22px;
    margin-bottom:24px;
    backdrop-filter:blur(14px);
}

.card h2{
    margin-bottom:16px;
    color:var(--gold);
    font-size:1.1rem;
}

/* Applicant item */
.applicant-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    padding:14px 0;
    border-bottom:1px solid rgba(255,255,255,0.06);
}

.applicant-item:last-child{
    border-bottom:none;
}

.applicant-number {
    font-weight: 800;
    font-size: 1.1rem;
    color: var(--gold);
    min-width: 35px;
}

.applicant-info{
    display:flex;
    flex-direction:column;
    gap:4px;
    flex: 1;
}

.applicant-name{
    font-weight:700;
}

.applicant-meta{
    color:var(--muted);
    font-size:0.88rem;
}

.status-badge{
    padding:6px 12px;
    border-radius:999px;
    font-size:0.78rem;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.03em;
}

.status-pending{
    background:rgba(234,179,8,0.18);
    color:#fde68a;
    border:1px solid rgba(234,179,8,0.28);
}

.status-approved{
    background:rgba(34,197,94,0.18);
    color:#bbf7d0;
    border:1px solid rgba(34,197,94,0.28);
}

.status-rejected{
    background:rgba(239,68,68,0.18);
    color:#fecaca;
    border:1px solid rgba(239,68,68,0.28);
}

.open-btn{
    background:var(--gold);
    color:#111827;
    border:none;
    padding:10px 14px;
    border-radius:12px;
    font-weight:700;
    cursor:pointer;
}

.open-btn:hover{
    filter:brightness(1.05);
}

.empty-state{
    color:var(--muted);
    text-align:center;
    padding:20px 0;
}

/* Process Tracker Styles */
.process-tracker {
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: rgba(0,0,0,0.2);
    padding: 16px;
    border-radius: 12px;
    border: 1px solid var(--border);
    margin-bottom: 18px;
}

.process-step {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 600;
    color: var(--muted);
}

.process-step.completed {
    color: #4ade80;
}

.editor-grid input, .editor-grid select {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.03);
    color: white;
    margin-top: 6px;
}

.editor-grid label {
    font-size: 0.85rem;
    color: var(--muted);
}

@media(max-width:900px){
    .admin-container{
        flex-direction:column;
    }

    .sidebar{
        width:100%;
        border-right:none;
        border-bottom:1px solid var(--border);
    }

    .content{
        padding:18px;
    }
}
</style>
</head>

<body>

<div id="adminLogin" style="max-width:420px;margin:80px auto;padding:30px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:20px;">
    <h2 style="color:#c5a880;margin-bottom:20px;text-align:center;">Admin Login</h2>

    <input id="adminEmail" type="email" placeholder="Admin email"
        style="width:100%;padding:14px;margin-bottom:15px;border-radius:12px;border:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.03);color:white;">

    <input id="adminPassword" type="password" placeholder="Password"
        style="width:100%;padding:14px;margin-bottom:20px;border-radius:12px;border:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.03);color:white;">

    <button id="adminLoginBtn"
        style="width:100%;padding:14px;border:none;border-radius:14px;background:#c5a880;color:#111827;font-weight:700;cursor:pointer;">
        Login
    </button>

    <p id="adminLoginMsg" style="text-align:center;margin-top:15px;color:#f87171;"></p>
</div>

<div class="admin-container" id="adminPanel" style="display:none;">

    <!-- Sidebar -->
    <aside class="sidebar">
        <h2>HYATT</h2>
        <p>Admin Portal</p>
        <nav>
            <button class="menu-btn active">
                📊 Dashboard
            </button>
            <button class="menu-btn">
                👥 Applicants
            </button>
            <button class="menu-btn logout">
                🚪 Logout
            </button>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="content">

        <header class="top-header">
            <div>
                <h1>Applicant Management</h1>
                <p>Welcome Administrator</p>
            </div>
        </header>

        <!-- Statistics -->
        <section class="stats-grid">
            <div class="stat-card">
                <h3>Total Applicants</h3>
                <h2 id="totalApplicants">0</h2>
            </div>
            <div class="stat-card">
                <h3>Submitted</h3>
                <h2 id="pendingApplicants">0</h2>
            </div>
            <div class="stat-card">
                <h3>Interviewed</h3>
                <h2 id="approvedApplicants">0</h2>
            </div>
            <div class="stat-card">
                <h3>Verified</h3>
                <h2 id="rejectedApplicants">0</h2>
            </div>
        </section>

        <!-- Search -->
        <section class="search-box">
            <input
                type="text"
                id="searchApplicant"
                placeholder="Search applicant by number, name, email or phone...">
        </section>

        <!-- All Applicants List (Unified Single Page) -->
        <section class="card">
            <h2>👥 All Applicants</h2>
            <div id="allApplicants">
                <!-- Firebase loads all applicants -->
            </div>
        </section>

        <!-- Applicant Editor -->
        <section class="card" id="editorSection" style="display:none;">
            <h2>📝 Edit Applicant</h2>

            <!-- Process Tracker for Admin -->
            <div class="process-tracker">
                <span style="font-size:0.85rem; color: var(--gold); font-weight:700;">COMPLETED STAGES TRACKER</span>
                <div class="process-step" id="stepAppSubmitted">
                    <span id="iconAppSubmitted">⚪</span> Application Submitted
                </div>
                <div class="process-step" id="stepIntSubmitted">
                    <span id="iconIntSubmitted">⚪</span> Interview Submitted
                </div>
                <div class="process-step" id="stepVerSubmitted">
                    <span id="iconVerSubmitted">⚪</span> Verification Submitted
                </div>
            </div>

            <div class="editor-grid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;">
                <div>
                    <label>Applicant Name</label>
                    <input id="editName" type="text">
                </div>

                <div>
                    <label>Email</label>
                    <input id="editEmail" type="email">
                </div>

                <div>
                    <label>Phone</label>
                    <input id="editPhone" type="text">
                </div>

                <div>
                    <label>Country</label>
                    <input id="editCountry" type="text">
                </div>

                <div>
                    <label>Education</label>
                    <input id="editEducation" type="text">
                </div>

                <div>
                    <label>Occupation</label>
                    <input id="editOccupation" type="text">
                </div>

                <div>
                    <label>Select Preset Status</label>
                    <select id="editStatusSelect" onchange="updateStatusText(this.value)">
                        <option value="NO APPLICATION FOUND">1. NO APPLICATION FOUND</option>
                        <option value="APPLICATION SUBMITTED">2. APPLICATION SUBMITTED</option>
                        <option value="INTERVIEW SUBMITTED">3. INTERVIEW SUBMITTED</option>
                        <option value="VERIFICATION SUBMITTED">4. VERIFICATION SUBMITTED</option>
                    </select>
                </div>

                <div>
                    <label>Application Status (Editable Space)</label>
                    <input id="editStatus" type="text" placeholder="Type custom status here..." oninput="updateProcessTracker(this.value)">
                </div>

                <div>
                    <label>Application Code</label>
                    <input id="editCode" type="text" placeholder="HYA-2026-001">
                </div>

                <div>
                    <label>Date Applied</label>
                    <input id="editDate" type="text" placeholder="01 Aug 2026">
                </div>
            </div>

            <div style="margin-top:18px;">
                <label>Information Message</label>
                <textarea id="editMessage" rows="4" style="width:100%;padding:14px;border-radius:14px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);color:white;margin-top:6px;"></textarea>
            </div>

            <div style="margin-top:18px;">
                <label>Information Link</label>
                <input id="editInfoLink" type="url" placeholder="https://..." style="width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);background:rgba(255,255,255,0.03);color:white;margin-top:6px;">
            </div>

            <div style="margin-top:18px;">
                <label>View Application Link</label>
                <input id="editViewLink" type="url" placeholder="https://..." style="width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);background:rgba(255,255,255,0.03);color:white;margin-top:6px;">
            </div>

            <button id="saveApplicantBtn" style="margin-top:24px;width:100%;padding:16px;border:none;border-radius:16px;background:#c5a880;color:#111827;font-weight:800;font-size:1rem;cursor:pointer;">
                SAVE CHANGES
            </button>

            <p id="saveMessage" style="text-align:center;margin-top:14px;color:#4ade80;font-weight:600;"></p>
        </section>

    </main>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyCsZbX8doOr6DxT7C9p8SK6YReKKlyVcNI",
    authDomain: "hyatt-regency-afc7e.firebaseapp.com",
    projectId: "hyatt-regency-afc7e",
    storageBucket: "hyatt-regency-afc7e.firebasestorage.app",
    messagingSenderId: "636460619228",
    appId: "1:636460619228:web:5734324ff28ca738f4eb19",
    measurementId: "G-K5KTLSKDRN"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const ADMIN_EMAIL = "fransescomarie@gmail.com";

const loginBox = document.getElementById("adminLogin");
const adminPanel = document.getElementById("adminPanel");
const loginMsg = document.getElementById("adminLoginMsg");

document.getElementById("adminLoginBtn").onclick = async () => {
    const email = document.getElementById("adminEmail").value.trim();
    const password = document.getElementById("adminPassword").value;

    loginMsg.innerText = "";

    if (email !== ADMIN_EMAIL) {
        loginMsg.innerText = "Unauthorized admin email.";
        return;
    }

    try {
        await signInWithEmailAndPassword(auth, email, password);
        loginBox.style.display = "none";
        adminPanel.style.display = "flex";
        loadApplicants();
    } catch (error) {
        loginMsg.innerText = "Invalid email or password.";
    }
};

document.querySelector(".logout").onclick = async () => {
    await signOut(auth);
    window.location.href = "index.html";
};

let applicantsCache = [];
let selectedApplicantId = null;

function loadApplicants() {
    const applicantsRef = collection(db, "Applicants");

    onSnapshot(applicantsRef, (snapshot) => {
        applicantsCache = [];
        snapshot.forEach((docSnap) => {
            applicantsCache.push({
                id: docSnap.id,
                ...docSnap.data()
            });
        });

        renderApplicants(applicantsCache);
        updateStatistics(applicantsCache);
    });
}

function updateStatistics(applicants) {
    totalApplicantsEl.innerText = applicants.length;

    let sub = 0, intv = 0, ver = 0;

    applicants.forEach(app => {
        const status = (app.applicationStatus || "").toUpperCase();
        if (status.includes("VERIFICATION")) ver++;
        else if (status.includes("INTERVIEW")) intv++;
        else if (status.includes("APPLICATION")) sub++;
    });

    pendingApplicantsEl.innerText = sub;
    approvedApplicantsEl.innerText = intv;
    rejectedApplicantsEl.innerText = ver;
}

function renderApplicants(applicants) {
    if (applicants.length === 0) {
        allApplicantsDiv.innerHTML = '<div class="empty-state">No applicants found</div>';
        return;
    }

    allApplicantsDiv.innerHTML = applicants.map((app, index) => {
        const status = app.applicationStatus || "NO APPLICATION FOUND";

        let statusClass = "status-pending";
        if (status.includes("VERIFICATION")) statusClass = "status-approved";
        if (status.includes("NO APPLICATION")) statusClass = "status-rejected";

        return `
            <div class="applicant-item">
                <div class="applicant-number">#${index + 1}</div>
                <div class="applicant-info">
                    <div class="applicant-name">${app.fullName || 'No Name'}</div>
                    <div class="applicant-meta">${app.email || ''} | ${app.phone || ''}</div>
                </div>

                <div style="display:flex;flex-direction:column;align-items:flex-end;gap:10px;">
                    <span class="status-badge ${statusClass}">${status}</span>
                    <button class="open-btn" onclick="openApplicant('${app.id}')">
                        Open
                    </button>
                </div>
            </div>
        `;
    }).join('');
}

const allApplicantsDiv = document.getElementById("allApplicants");
const searchInput = document.getElementById("searchApplicant");
const totalApplicantsEl = document.getElementById("totalApplicants");
const pendingApplicantsEl = document.getElementById("pendingApplicants");
const approvedApplicantsEl = document.getElementById("approvedApplicants");
const rejectedApplicantsEl = document.getElementById("rejectedApplicants");

searchInput.addEventListener('input', (e) => {
    const term = e.target.value.toLowerCase();
    const filtered = applicantsCache.filter((app, index) =>
        `#${index + 1}`.includes(term) ||
        (app.fullName || '').toLowerCase().includes(term) ||
        (app.email || '').toLowerCase().includes(term) ||
        (app.phone || '').toLowerCase().includes(term)
    );
    renderApplicants(filtered);
});

window.openApplicant = function(id) {
    const applicant = applicantsCache.find(app => app.id === id);
    if (!applicant) return;

    selectedApplicantId = id;
    document.getElementById("editorSection").style.display = "block";

    document.getElementById("editName").value = applicant.fullName || "";
    document.getElementById("editEmail").value = applicant.email || "";
    document.getElementById("editPhone").value = applicant.phone || "";
    document.getElementById("editCountry").value = applicant.country || "";
    document.getElementById("editEducation").value = applicant.education || "";
    document.getElementById("editOccupation").value = applicant.occupation || "";

    const currentStatus = applicant.applicationStatus || "NO APPLICATION FOUND";
    document.getElementById("editStatus").value = currentStatus;
    
    // Set dropdown match if existing
    const selectEl = document.getElementById("editStatusSelect");
    if([...selectEl.options].some(o => o.value === currentStatus)) {
        selectEl.value = currentStatus;
    }

    document.getElementById("editCode").value = applicant.applicationCode || "";
    document.getElementById("editDate").value = applicant.dateApplied || "";
    document.getElementById("editMessage").value = applicant.infoMessage || "";
    document.getElementById("editInfoLink").value = applicant.infoLink || "";
    document.getElementById("editViewLink").value = applicant.viewAppLink || "";

    updateProcessTracker(currentStatus);
    document.getElementById("editorSection").scrollIntoView({ behavior: "smooth" });
};

window.updateStatusText = function(val) {
    document.getElementById("editStatus").value = val;
    updateProcessTracker(val);
};

window.updateProcessTracker = function(statusText) {
    const val = statusText.toUpperCase();

    const appSubmitted = val.includes("APPLICATION SUBMITTED") || val.includes("INTERVIEW SUBMITTED") || val.includes("VERIFICATION SUBMITTED");
    const intSubmitted = val.includes("INTERVIEW SUBMITTED") || val.includes("VERIFICATION SUBMITTED");
    const verSubmitted = val.includes("VERIFICATION SUBMITTED");

    setStep("stepAppSubmitted", "iconAppSubmitted", appSubmitted);
    setStep("stepIntSubmitted", "iconIntSubmitted", intSubmitted);
    setStep("stepVerSubmitted", "iconVerSubmitted", verSubmitted);
};

function setStep(stepId, iconId, isDone) {
    const stepEl = document.getElementById(stepId);
    const iconEl = document.getElementById(iconId);
    if (isDone) {
        stepEl.classList.add("completed");
        iconEl.innerText = "✅";
    } else {
        stepEl.classList.remove("completed");
        iconEl.innerText = "⚪";
    }
}

document.getElementById("saveApplicantBtn").onclick = async () => {
    if (!selectedApplicantId) return;

    const updatedData = {
        fullName: document.getElementById("editName").value,
        email: document.getElementById("editEmail").value,
        phone: document.getElementById("editPhone").value,
        country: document.getElementById("editCountry").value,
        education: document.getElementById("editEducation").value,
        occupation: document.getElementById("editOccupation").value,
        applicationStatus: document.getElementById("editStatus").value,
        applicationCode: document.getElementById("editCode").value,
        dateApplied: document.getElementById("editDate").value,
        infoMessage: document.getElementById("editMessage").value,
        infoLink: document.getElementById("editInfoLink").value,
        viewAppLink: document.getElementById("editViewLink").value
    };

    try {
        const appRef = doc(db, "Applicants", selectedApplicantId);
        await updateDoc(appRef, updatedData);
        
        const saveMsg = document.getElementById("saveMessage");
        saveMsg.innerText = "Changes saved successfully!";
        setTimeout(() => { saveMsg.innerText = ""; }, 3000);
    } catch (err) {
        alert("Error saving record: " + err.message);
    }
};
</script>
</body>
</html>
