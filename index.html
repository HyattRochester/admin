<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyatt Admin Portal</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
:root {
    --bg: #0f172a;
    --bg-soft: #111827;
    --card: rgba(255,255,255,0.04);
    --border: rgba(255,255,255,0.08);
    --text: #f8fafc;
    --muted: #94a3b8;
    --gold: #c5a880;
    --green: #22c55e;
    --red: #ef4444;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Plus Jakarta Sans',sans-serif;
    background:linear-gradient(135deg,#0b1220,#111827);
    color:var(--text);
    min-height:100vh;
}

.admin-container{
    display:flex;
    min-height:100vh;
}

/* Sidebar */
.sidebar{
    width:250px;
    background:rgba(0,0,0,0.25);
    border-right:1px solid var(--border);
    padding:24px 18px;
    display:flex;
    flex-direction:column;
    gap:20px;
}

.sidebar h2{
    font-family:'Playfair Display',serif;
    font-size:1.8rem;
    color:var(--gold);
}

.sidebar p{
    color:var(--muted);
    font-size:0.9rem;
    margin-bottom:10px;
}

.sidebar nav{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.menu-btn{
    background:transparent;
    border:1px solid var(--border);
    color:var(--text);
    padding:12px 14px;
    border-radius:12px;
    text-align:left;
    cursor:pointer;
    transition:all .2s ease;
    font-weight:600;
}

.menu-btn:hover,
.menu-btn.active{
    background:rgba(197,168,128,0.15);
    border-color:var(--gold);
    color:var(--gold);
}

.menu-btn.logout:hover{
    background:rgba(239,68,68,0.15);
    border-color:var(--red);
    color:#fecaca;
}

/* Content */
.content{
    flex:1;
    padding:28px;
}

.top-header{
    margin-bottom:24px;
}

.top-header h1{
    font-size:2rem;
    margin-bottom:6px;
}

.top-header p{
    color:var(--muted);
}

/* Stats */
.stats-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:16px;
    margin-bottom:24px;
}

.stat-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    padding:20px;
    backdrop-filter:blur(12px);
}

.stat-card h3{
    color:var(--muted);
    font-size:0.9rem;
    margin-bottom:8px;
}

.stat-card h2{
    font-size:2rem;
    color:var(--gold);
}

/* Search */
.search-box{
    margin-bottom:24px;
}

.search-box input{
    width:100%;
    padding:14px 16px;
    border-radius:14px;
    border:1px solid var(--border);
    background:rgba(255,255,255,0.03);
    color:var(--text);
    font-size:0.95rem;
    outline:none;
}

.search-box input:focus{
    border-color:var(--gold);
}

/* Cards */
.card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:22px;
    padding:22px;
    margin-bottom:24px;
    backdrop-filter:blur(14px);
}

.card h2{
    margin-bottom:16px;
    color:var(--gold);
    font-size:1.1rem;
}

/* Applicant item */
.applicant-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    padding:14px 0;
    border-bottom:1px solid rgba(255,255,255,0.06);
}

.applicant-item:last-child{
    border-bottom:none;
}

.applicant-info{
    display:flex;
    flex-direction:column;
    gap:4px;
}

.applicant-name{
    font-weight:700;
}

.applicant-meta{
    color:var(--muted);
    font-size:0.88rem;
}

.status-badge{
    padding:6px 12px;
    border-radius:999px;
    font-size:0.78rem;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.03em;
}

.status-pending{
    background:rgba(234,179,8,0.18);
    color:#fde68a;
    border:1px solid rgba(234,179,8,0.28);
}

.status-approved{
    background:rgba(34,197,94,0.18);
    color:#bbf7d0;
    border:1px solid rgba(34,197,94,0.28);
}

.status-rejected{
    background:rgba(239,68,68,0.18);
    color:#fecaca;
    border:1px solid rgba(239,68,68,0.28);
}

.open-btn{
    background:var(--gold);
    color:#111827;
    border:none;
    padding:8px 14px;
    border-radius:10px;
    font-weight:700;
    cursor:pointer;
}

.open-btn:hover{
    filter:brightness(1.05);
}

/* Interview Styling */
.interview-btn {
    background: rgba(197, 168, 128, 0.15);
    color: var(--gold);
    border: 1px solid var(--gold);
    padding: 8px 12px;
    border-radius: 10px;
    font-size: 0.8rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
}

.interview-btn:hover {
    background: var(--gold);
    color: #111827;
}

.no-interview-badge {
    color: var(--muted);
    font-size: 0.8rem;
    padding: 6px 10px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 8px;
}

/* Modal Overlay */
.modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.8);
    backdrop-filter: blur(8px);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 10000;
    padding: 20px;
}

.modal-card {
    background: #111827;
    border: 1px solid var(--border);
    border-radius: 20px;
    max-width: 650px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
    padding: 28px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.6);
}

.interview-qa-item {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 12px;
}

.interview-qa-item label {
    color: var(--gold);
    font-size: 0.85rem;
    font-weight: 700;
    display: block;
    margin-bottom: 4px;
}

.interview-qa-item div {
    color: var(--text);
    font-size: 0.95rem;
}

.empty-state{
    color:var(--muted);
    text-align:center;
    padding:20px 0;
}

/* Form Styling */
.editor-grid label, section.card label {
    display: block;
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 6px;
    font-weight: 600;
}

.editor-grid input, .editor-grid select, section.card input, section.card select {
    width: 100%;
    padding: 12px 14px;
    border-radius: 12px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    color: white;
    outline: none;
}

.editor-grid input:focus, .editor-grid select:focus, section.card textarea:focus {
    border-color: var(--gold);
}

.editor-grid select option {
    background: #111827;
    color: white;
}

/* Toast Popup */
.toast-popup {
    position: fixed;
    top: 30px;
    right: 30px;
    background: rgba(17, 24, 39, 0.95);
    border: 1px solid var(--green);
    color: #ffffff;
    padding: 16px 24px;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    display: flex;
    align-items: center;
    gap: 12px;
    z-index: 9999;
    transform: translateY(-100px);
    opacity: 0;
    transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    backdrop-filter: blur(10px);
}

.toast-popup.show {
    transform: translateY(0);
    opacity: 1;
}

.toast-icon {
    width: 28px;
    height: 28px;
    background: rgba(34, 197, 94, 0.2);
    color: var(--green);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 1rem;
}

@media(max-width:900px){
    .admin-container{
        flex-direction:column;
    }

    .sidebar{
        width:100%;
        border-right:none;
        border-bottom:1px solid var(--border);
    }

    .content{
        padding:18px;
    }
}
</style>
</head>

<body>

    <!-- Toast Notification Popup -->
    <div id="toastPopup" class="toast-popup">
        <div class="toast-icon">✓</div>
        <div>
            <div style="font-weight: 700; font-size: 0.95rem; color: #bbf7d0;">Success</div>
            <div style="font-size: 0.85rem; color: var(--muted);" id="toastMsg">Updated Successfully!</div>
        </div>
    </div>

    <!-- Interview Modal -->
    <div id="interviewModal" class="modal-overlay">
        <div class="modal-card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <h2 style="color:var(--gold); font-size:1.3rem;">🎙️ Interview Submission</h2>
                <button onclick="closeInterviewModal()" style="background:none; border:none; color:var(--muted); font-size:1.5rem; cursor:pointer;">&times;</button>
            </div>
            
            <div id="modalApplicantDetails" style="margin-bottom:20px; color:var(--muted); font-size:0.9rem; border-bottom:1px solid var(--border); padding-bottom:12px;"></div>
            
            <div id="interviewQAContent">
                <!-- Interview Q&A renders here -->
            </div>

            <button onclick="closeInterviewModal()" style="margin-top:20px; width:100%; padding:12px; background:rgba(255,255,255,0.05); border:1px solid var(--border); color:white; border-radius:12px; font-weight:700; cursor:pointer;">
                Close
            </button>
        </div>
    </div>

    <!-- Admin Login -->
    <div id="adminLogin" style="max-width:420px;margin:80px auto;padding:30px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:20px;">
        <h2 style="color:#c5a880;margin-bottom:20px;text-align:center;">Admin Login</h2>

        <input id="adminEmail" type="email" placeholder="Admin email"
            style="width:100%;padding:14px;margin-bottom:15px;border-radius:12px;border:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.03);color:white;">

        <input id="adminPassword" type="password" placeholder="Password"
            style="width:100%;padding:14px;margin-bottom:20px;border-radius:12px;border:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.03);color:white;">

        <button id="adminLoginBtn"
            style="width:100%;padding:14px;border:none;border-radius:14px;background:#c5a880;color:#111827;font-weight:700;cursor:pointer;">
            Login
        </button>

        <p id="adminLoginMsg" style="text-align:center;margin-top:15px;color:#f87171;"></p>
    </div>

    <div class="admin-container" id="adminPanel" style="display:none;">

        <!-- Sidebar -->
        <aside class="sidebar">
            <h2>HYATT</h2>
            <p>Admin Portal</p>

            <nav>
                <button class="menu-btn active">📊 Dashboard</button>
                <button class="menu-btn">👥 Applicants</button>
                <button class="menu-btn">📥 New Applications</button>
                <button class="menu-btn">📈 Statistics</button>
                <button class="menu-btn logout">🚪 Logout</button>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="content">

            <header class="top-header">
                <div>
                    <h1>Applicant Management</h1>
                    <p>Welcome Administrator</p>
                </div>
            </header>

            <!-- Statistics -->
            <section class="stats-grid">
                <div class="stat-card">
                    <h3>Total Applicants</h3>
                    <h2 id="totalApplicants">0</h2>
                </div>
                <div class="stat-card">
                    <h3>Pending</h3>
                    <h2 id="pendingApplicants">0</h2>
                </div>
                <div class="stat-card">
                    <h3>Approved</h3>
                    <h2 id="approvedApplicants">0</h2>
                </div>
                <div class="stat-card">
                    <h3>Rejected</h3>
                    <h2 id="rejectedApplicants">0</h2>
                </div>
            </section>

            <!-- Search -->
            <section class="search-box">
                <input
                    type="text"
                    id="searchApplicant"
                    placeholder="Search applicant by name, email or phone...">
            </section>

            <!-- Most Recent Applicant -->
            <section class="card">
                <h2>🆕 Most Recent Applicant</h2>
                <div id="newApplicants">
                    <!-- Loaded dynamically from Firebase -->
                </div>
            </section>

            <!-- All Applicants -->
            <section class="card">
                <h2>👥 All Applicants</h2>
                <div id="allApplicants">
                    <!-- Firebase loads all applicants -->
                </div>
            </section>

            <!-- Applicant Editor -->
            <section class="card" id="editorSection" style="display:none;">
                <h2>📝 Edit Applicant</h2>

                <div class="editor-grid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;">
                    <div>
                        <label>Applicant Name</label>
                        <input id="editName" type="text" disabled>
                    </div>

                    <div>
                        <label>Email</label>
                        <input id="editEmail" type="email" disabled>
                    </div>

                    <div>
                        <label>Phone</label>
                        <input id="editPhone" type="text" disabled>
                    </div>

                    <div>
                        <label>Country</label>
                        <input id="editCountry" type="text" disabled>
                    </div>

                    <div>
                        <label>Education</label>
                        <input id="editEducation" type="text" disabled>
                    </div>

                    <div>
                        <label>Occupation</label>
                        <input id="editOccupation" type="text" disabled>
                    </div>

                    <div>
                        <label>Application Status</label>
                        <select id="editStatus">
                            <option value="Pending">Pending</option>
                            <option value="Approved">Approved</option>
                            <option value="Rejected">Rejected</option>
                            <option value="Interview Scheduled">Interview Scheduled</option>
                        </select>
                    </div>

                    <div>
                        <label>Application Code</label>
                        <input id="editCode" type="text" placeholder="HYA-2026-001">
                    </div>

                    <div>
                        <label>Date Applied</label>
                        <input id="editDate" type="text" placeholder="01 Aug 2026">
                    </div>
                </div>

                <div style="margin-top:18px;">
                    <label>Information Message</label>
                    <textarea id="editMessage" rows="5" style="width:100%;padding:14px;border-radius:14px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);color:white;outline:none;"></textarea>
                </div>

                <div style="margin-top:18px;">
                    <label>Information Link</label>
                    <input id="editInfoLink" type="url" placeholder="https://...">
                </div>

                <div style="margin-top:18px;">
                    <label>View Application Link</label>
                    <input id="editViewLink" type="url" placeholder="https://...">
                </div>

                <button id="saveApplicantBtn" style="margin-top:24px;width:100%;padding:16px;border:none;border-radius:16px;background:#c5a880;color:#111827;font-weight:800;font-size:1rem;cursor:pointer;transition:all 0.2s ease;">
                    SAVE CHANGES
                </button>
            </section>

        </main>
    </div>

   <!-- Firebase Script -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import {
        getAuth,
        signInWithEmailAndPassword,
        signOut
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import {
        getFirestore,
        collection,
        onSnapshot,
        doc,
        updateDoc
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // Firebase Config
    const firebaseConfig = {
        apiKey: "AIzaSyCsZbX8doOr6DxT7C9p8SK6YReKKlyVcNI",
        authDomain: "hyatt-regency-afc7e.firebaseapp.com",
        projectId: "hyatt-regency-afc7e",
        storageBucket: "hyatt-regency-afc7e.firebasestorage.app",
        messagingSenderId: "636460619228",
        appId: "1:636460619228:web:5734324ff28ca738f4eb19",
        measurementId: "G-K5KTLSKDRN"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const ADMIN_EMAIL = "fransescomarie@gmail.com";

    const loginBox = document.getElementById("adminLogin");
    const adminPanel = document.getElementById("adminPanel");
    const loginMsg = document.getElementById("adminLoginMsg");

    const allApplicantsDiv = document.getElementById("allApplicants");
    const newApplicantsDiv = document.getElementById("newApplicants");
    const searchInput = document.getElementById("searchApplicant");

    const totalApplicantsEl = document.getElementById("totalApplicants");
    const pendingApplicantsEl = document.getElementById("pendingApplicants");
    const approvedApplicantsEl = document.getElementById("approvedApplicants");
    const rejectedApplicantsEl = document.getElementById("rejectedApplicants");

    let applicantsCache = [];
    let interviewsCache = [];
    let selectedApplicantId = null;

    // Login Handler
    document.getElementById("adminLoginBtn").onclick = async () => {
        const email = document.getElementById("adminEmail").value.trim();
        const password = document.getElementById("adminPassword").value;

        loginMsg.innerText = "";

        if (email !== ADMIN_EMAIL) {
            loginMsg.innerText = "Unauthorized admin email.";
            return;
        }

        try {
            await signInWithEmailAndPassword(auth, email, password);
            loginBox.style.display = "none";
            adminPanel.style.display = "flex";

            loadInterviews();
            loadApplicants();
        } catch (error) {
            loginMsg.innerText = "Invalid email or password.";
        }
    };

    // Logout
    document.querySelector(".logout").onclick = async () => {
        await signOut(auth);
        window.location.href = "index.html";
    };

    // Realtime Interviews Loader (Capitalized collection name from your screenshot)
    function loadInterviews() {
        const interviewsRef = collection(db, "Interviews");
        onSnapshot(interviewsRef, (snapshot) => {
            interviewsCache = [];
            snapshot.forEach((docSnap) => {
                interviewsCache.push({
                    id: docSnap.id,
                    ...docSnap.data()
                });
            });
            renderApplicants(applicantsCache);
            renderNewApplicant(applicantsCache);
        }, (err) => {
            console.error("Error loading Interviews collection:", err);
        });
    }

    // Match applicant to interview using UID, Document ID, Email, or Full Name
    function getApplicantInterview(applicant) {
        if (!applicant) return null;
        return interviewsCache.find(i => {
            const uidMatch = (i.uid && applicant.uid && i.uid === applicant.uid) ||
                             (i.uid && i.uid === applicant.id) ||
                             (i.id === applicant.id);

            const emailMatch = i.email && applicant.email && 
                               i.email.toLowerCase().trim() === applicant.email.toLowerCase().trim();

            const nameMatch = (i.fullName && applicant.fullName && 
                               i.fullName.toLowerCase().trim() === applicant.fullName.toLowerCase().trim()) ||
                              (i.fullName && applicant.fullName && 
                               i.fullName.toLowerCase().trim().includes(applicant.fullName.toLowerCase().trim()));

            return uidMatch || emailMatch || nameMatch;
        });
    }

    // Realtime Applicants Data Loader
    function loadApplicants() {
        const applicantsRef = collection(db, "Applicants");

        onSnapshot(applicantsRef, (snapshot) => {
            applicantsCache = [];

            snapshot.forEach((docSnap) => {
                applicantsCache.push({
                    id: docSnap.id,
                    ...docSnap.data()
                });
            });

            renderApplicants(applicantsCache);
            renderNewApplicant(applicantsCache);
            updateStatistics(applicantsCache);
        });
    }

    // Stats Update
    function updateStatistics(applicants) {
        totalApplicantsEl.innerText = applicants.length;

        let pending = 0;
        let approved = 0;
        let rejected = 0;

        applicants.forEach(app => {
            const status = (app.applicationStatus || "").toLowerCase();
            if (status.includes("approved")) approved++;
            else if (status.includes("rejected")) rejected++;
            else pending++;
        });

        pendingApplicantsEl.innerText = pending;
        approvedApplicantsEl.innerText = approved;
        rejectedApplicantsEl.innerText = rejected;
    }

    // Render ONLY ONE latest applicant in "Most Recent Applicant"
    function renderNewApplicant(applicants) {
        if (!applicants || applicants.length === 0) {
            newApplicantsDiv.innerHTML = '<div class="empty-state">No recent applicants</div>';
            return;
        }

        const latestApp = applicants[applicants.length - 1];
        const status = latestApp.applicationStatus || "Pending";

        let statusClass = "status-pending";
        if (status.toLowerCase().includes("approved")) statusClass = "status-approved";
        if (status.toLowerCase().includes("rejected")) statusClass = "status-rejected";

        // Check Interview Status
        const interviewData = getApplicantInterview(latestApp);
        const interviewUI = interviewData 
            ? `<button class="interview-btn" onclick="openInterviewModal('${latestApp.id}')">🎙️ View Interview</button>`
            : `<span class="no-interview-badge">Not submitted</span>`;

        newApplicantsDiv.innerHTML = `
            <div class="applicant-item">
                <div class="applicant-info">
                    <div class="applicant-name" style="font-size:1.05rem;">${latestApp.fullName || 'No Name'}</div>
                    <div class="applicant-meta">${latestApp.email || ''} • ${latestApp.phone || ''}</div>
                    <div class="applicant-meta" style="color:var(--gold); font-size:0.8rem; margin-top:2px;">
                        Applied: ${latestApp.dateApplied || 'Just now'}
                    </div>
                </div>

                <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px;">
                    <span class="status-badge ${statusClass}">${status}</span>
                    <div style="display:flex; gap:8px; align-items:center;">
                        ${interviewUI}
                        <button class="open-btn" onclick="openApplicant('${latestApp.id}')">
                            Open
                        </button>
                    </div>
                </div>
            </div>
        `;
    }

    // Render All Applicants (Most Recent FIRST)
    function renderApplicants(applicants) {
        if (applicants.length === 0) {
            allApplicantsDiv.innerHTML = '<div class="empty-state">No applicants found</div>';
            return;
        }

        const sortedApplicants = [...applicants].reverse();

        allApplicantsDiv.innerHTML = sortedApplicants.map(app => {
            const status = app.applicationStatus || "Pending";

            let statusClass = "status-pending";
            if (status.toLowerCase().includes("approved")) statusClass = "status-approved";
            if (status.toLowerCase().includes("rejected")) statusClass = "status-rejected";

            // Check Interview Status
            const interviewData = getApplicantInterview(app);
            const interviewUI = interviewData 
                ? `<button class="interview-btn" onclick="openInterviewModal('${app.id}')">🎙️ View Interview</button>`
                : `<span class="no-interview-badge">Not submitted</span>`;

            return `
                <div class="applicant-item">
                    <div class="applicant-info">
                        <div class="applicant-name">${app.fullName || 'No Name'}</div>
                        <div class="applicant-meta">${app.email || ''} | ${app.phone || ''}</div>
                    </div>

                    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px;">
                        <span class="status-badge ${statusClass}">${status}</span>
                        <div style="display:flex; gap:8px; align-items:center;">
                            ${interviewUI}
                            <button class="open-btn" onclick="openApplicant('${app.id}')">
                                Open
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }).join('');
    }

    // Search Filter
    searchInput.addEventListener('input', (e) => {
        const term = e.target.value.toLowerCase();
        const filtered = applicantsCache.filter(app =>
            (app.fullName || '').toLowerCase().includes(term) ||
            (app.email || '').toLowerCase().includes(term) ||
            (app.phone || '').toLowerCase().includes(term)
        );
        renderApplicants(filtered);
    });

    // Open Interview Modal (Handles nested responses map: q1, q2, q3...)
    window.openInterviewModal = function(applicantId) {
        const applicant = applicantsCache.find(a => a.id === applicantId);
        const interview = getApplicantInterview(applicant);

        if (!interview) {
            alert("No interview submission found for this applicant.");
            return;
        }

        document.getElementById("modalApplicantDetails").innerHTML = `
            Applicant: <strong style="color:white;">${interview.fullName || applicant?.fullName || 'N/A'}</strong>
            <br>Position: <span style="color:var(--gold);">${interview.appliedPosition || 'N/A'}</span>
        `;

        const qaContainer = document.getElementById("interviewQAContent");
        qaContainer.innerHTML = "";

        // Extracts response map if present (as in your Firestore schema)
        const responseData = interview.responses || interview;

        const ignoredKeys = ['id', 'applicantId', 'email', 'timestamp', 'createdAt', 'uid', 'fullName', 'appliedPosition', 'responses'];
        
        let hasContent = false;
        for (const [key, value] of Object.entries(responseData)) {
            if (!ignoredKeys.includes(key) && value) {
                hasContent = true;
                
                // Formats q1 -> Question 1, q2 -> Question 2
                let labelTitle = key;
                if (/^q\d+$/i.test(key)) {
                    labelTitle = key.replace(/^q/i, 'Question ');
                } else {
                    labelTitle = key.replace(/([A-Z])/g, ' $1').replace(/^./, str => str.toUpperCase());
                }

                qaContainer.innerHTML += `
                    <div class="interview-qa-item">
                        <label>${labelTitle}</label>
                        <div>${value}</div>
                    </div>
                `;
            }
        }

        if (!hasContent) {
            qaContainer.innerHTML = `<div style="text-align:center; color:var(--muted); padding:20px;">Interview record has no detailed responses.</div>`;
        }

        document.getElementById("interviewModal").style.display = "flex";
    };

    window.closeInterviewModal = function() {
        document.getElementById("interviewModal").style.display = "none";
    };

    // Open Applicant Editor
    window.openApplicant = function(id) {
        const applicant = applicantsCache.find(app => app.id === id);
        if (!applicant) return;

        selectedApplicantId = id;

        document.getElementById("editorSection").style.display = "block";

        document.getElementById("editName").value = applicant.fullName || "";
        document.getElementById("editEmail").value = applicant.email || "";
        document.getElementById("editPhone").value = applicant.phone || "";
        document.getElementById("editCountry").value = applicant.country || "";
        document.getElementById("editEducation").value = applicant.education || "";
        document.getElementById("editOccupation").value = applicant.occupation || "";

        document.getElementById("editStatus").value = applicant.applicationStatus || "Pending";
        document.getElementById("editCode").value = applicant.applicationCode || "";
        document.getElementById("editDate").value = applicant.dateApplied || "";
        document.getElementById("editMessage").value = applicant.infoMessage || "";
        document.getElementById("editInfoLink").value = applicant.infoLink || "";
        document.getElementById("editViewLink").value = applicant.viewAppLink || "";

        document.getElementById("editorSection").scrollIntoView({ behavior: "smooth" });
    };

    // Save Changes
    document.getElementById("saveApplicantBtn").addEventListener("click", async () => {
        if (!selectedApplicantId) {
            alert("Please select an applicant first.");
            return;
        }

        const saveBtn = document.getElementById("saveApplicantBtn");
        saveBtn.disabled = true;
        saveBtn.innerText = "SAVING...";

        try {
            const docRef = doc(db, "Applicants", selectedApplicantId);

            await updateDoc(docRef, {
                applicationStatus: document.getElementById("editStatus").value,
                applicationCode: document.getElementById("editCode").value.trim(),
                dateApplied: document.getElementById("editDate").value.trim(),
                infoMessage: document.getElementById("editMessage").value,
                infoLink: document.getElementById("editInfoLink").value.trim(),
                viewAppLink: document.getElementById("editViewLink").value.trim()
            });

            showSuccessModal("Updated Successfully!");

        } catch (error) {
            console.error("Error updating applicant:", error);
            alert("Error updating: " + error.message);
        } finally {
            saveBtn.disabled = false;
            saveBtn.innerText = "SAVE CHANGES";
        }
    });

    // Toast Helper
    function showSuccessModal(message) {
        const toast = document.getElementById("toastPopup");
        document.getElementById("toastMsg").innerText = message;

        toast.classList.add("show");

        setTimeout(() => {
            toast.classList.remove("show");
        }, 3000);
    }
</script>
</body>
</html>
